name: Aggregate Sensory Stats

on:
  schedule:
    # ⏰ 매일 자정(UTC 15:00 = 한국시간 00:00) 또는 3시간마다 실행
    - cron: '10 * * * *'
  workflow_dispatch: # 필요할 때 깃허브 웹에서 'Run workflow' 버튼으로 즉시 수동 실행 가능

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install firebase-admin

      - name: 집계 스크립트 실행
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/aggregate_sensory.py
